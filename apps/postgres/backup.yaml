apiVersion: v1
kind: PersistentVolumeClaim          # a separate disk just for backups
metadata:
  name: postgres-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---                                   # "---" = next object in the same file
apiVersion: batch/v1
kind: CronJob                         # a task that runs on a schedule
metadata:
  name: postgres-backup
spec:
  schedule: "0 3 * * 0"               # minute hour day month weekday → Sunday 03:00
  timeZone: Asia/Tashkent             # without this, 03:00 means UTC (= 08:00 Tashkent)
  startingDeadlineSeconds: 518400     # Mac was off at 03:00? still run it within 6 days
  concurrencyPolicy: Forbid           # never run two backups at once
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:17-alpine
              command:
                - sh
                - -c
                - |
                  pg_dump -h postgres -U zafarr zafarr > /backups/zafarr-$(date +%F-%H%M).sql
                  find /backups -name "*.sql" -mtime +28 -delete   # keep about 4 weekly backups
                  ls -lh /backups
              env:
                - name: PGPASSWORD            # pg_dump reads the password from here
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret   # same Secret Postgres uses
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
