apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend

spec:
  ingressClassName: traefik
  rules:
    - host: api.zafarr.info          # requests for this address...
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend        # ...go to the backend Service
                port:
                  number: 80
