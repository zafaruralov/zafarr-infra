# stt-worker: takes jobs from the queue and runs the Uzbek model. Heavy on CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-worker
  namespace: stt
spec:
  # no "replicas:" here: the HPA (hpa.yaml) decides how many workers run.
  # If git said "replicas: 1", ArgoCD and the HPA would fight forever.
  selector:
    matchLabels: { app: stt-worker }
  template:
    metadata:
      labels: { app: stt-worker }
    spec:
      terminationGracePeriodSeconds: 60     # time to finish the current job after SIGTERM
      containers:
        - name: worker
          image: ghcr.io/zafaruralov/zafarr-stt:e277e043784947612e316ca5d5ca0784d7007590
          command: ["python", "worker.py"]  # same image as the API, different program
          env:
            - name: THREADS
              value: "2"
            # LLM text cleanup. The key is made by hand (never in git):
            #   kubectl -n stt create secret generic llm-secret --from-literal=OPENAI_API_KEY=sk-...
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secret
                  key: OPENAI_API_KEY
                  optional: true             # no Secret yet → cleanup is just off
            - name: LLM_MODEL
              value: gpt-4o-mini
            - name: LLM_DAILY_LIMIT
              value: "200"                   # max cleanups per day for the whole site
          resources:
            requests: { cpu: 500m, memory: 512Mi }   # HPA measures CPU use against this request
            limits: { cpu: "2", memory: 1Gi }
