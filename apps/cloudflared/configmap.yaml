apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared

data:
  config.yaml: |
    tunnel: 4c1942ee-0b4b-4dea-bc87-6f03cac9872c       # tunnel "zafarr" (id is not secret)
    credentials-file: /etc/cloudflared/creds/credentials.json   # from Secret tunnel-credentials
    metrics: 0.0.0.0:2000                              # /ready endpoint for the probe
    no-autoupdate: true

    # Which public name goes where. Everything goes to Traefik (the cluster's front door),
    # and the Ingress rules decide which app gets it.
    ingress:
      - hostname: k8s.zafarr.info
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: api.zafarr.info
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: stt.zafarr.info
        service: http://traefik.kube-system.svc.cluster.local:80
      - service: http_status:404                        # anything else
