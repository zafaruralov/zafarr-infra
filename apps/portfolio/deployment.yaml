apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio

spec:
  replicas: 3

  selector:                      # "which pods belong to me?" (must match template labels)
    matchLabels:
      app: portfolio

  template:                      # the blueprint for each pod
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: ghcr.io/zafaruralov/portfolio:3fea9803191a484a1f627d784263e31c84076303
          ports:
            - containerPort: 80
          volumeMounts:          # nginx config from the ConfigMap
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
