apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio

spec:
  replicas: 3

  selector:                      # "which pods belong to me?" (must match template labels)
    matchLabels:
      app: portfolio

  template:                      # the blueprint for each pod
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: portfolio:v2    # built from ~/Documents/project/portfolio/portfolio, imported with k3d
          ports:
            - containerPort: 80
          volumeMounts:          # nginx config from the ConfigMap
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
