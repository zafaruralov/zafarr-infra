apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy                    # ① the log COLLECTOR ("postman")
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.1
    helm:
      valuesObject:
        controller:
          type: deployment       # 1 pod is enough: it reads logs through the Kubernetes API
          replicas: 1
        alloy:
          configMap:
            content: |
              // 1. find every pod in the cluster
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // 2. give each log line useful labels (to filter by in Grafana)
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
              }

              // 3. read the logs of those pods...
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }

              // 4. ...and send them to Loki
              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
